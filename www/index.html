<html>

<head>
  <script>/*window.DEBUG = true;*/</script>
  <link rel="stylesheet" href="./MultiRangeSlider.css" />
  <script src="MultiRangeSlider.js"></script>
</head>
<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
    background-color: #333;
  }

  @media (max-aspect-ratio: 4/3) {
    .landscape #preview > img {
      width: 100%;
      overflow-y: scroll;
    }
  }

  @media (min-aspect-ratio: 4/3) {
    .landscape #preview > img {
      height: 100%;
      overflow-x: scroll;
    }
  }

  @media (max-aspect-ratio: 3/4) {
    .portrait #preview > img {
      width: 100%;
      overflow-y: scroll;
    }
  }

  @media (min-aspect-ratio: 3/4) {
    .portrait #preview > img {
      height: 100%;
      overflow-x: scroll;
    }
  }

  #menu {
    position: fixed;
    left: 0.2em;
    right: 1em;
    z-index: 2;
    width: min-content;
  }

  #menu>.icon {
    opacity: 0.5;
  }

  .icon {
    position: relative;
    display: inline-block;
    font-size: calc(3vw + 3vh);
    padding-top: 1vh;
  }

  #moreToggle {
    font-size: 3em;
    color: white;
    background-color: rgba(0, 0, 0, 0.5);
    display: inline-block;
    position: fixed;
    top: 0.2em;
    right: 0.2em;
    padding: 0px 0.3em 0.15em;
  }

  #more {
    color: white;
    background-color: rgba(0, 0, 0, 0.3);
    position: absolute;
    bottom: 0;
    width: 100%;
    z-index: 3;
    text-align: center;
    font-size: 3em;
  }

  #more * {
    font-size: inherit;
  }

  a {
    color: inherit;
    text-decoration: inherit;
  }

  input {
    background: none;
    border: none;
    font: inherit;
    color: white;    
    width: 10em;
  }

  .multi-range-slider {
    border: none;
    box-shadow: none;
  }
</style>

<body>
</body>
<script src="ui.js" type="module">
</script>

</html>
